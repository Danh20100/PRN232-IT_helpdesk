services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Root@12345"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  api:
    build: ./HelpdeskApi
    depends_on:
      - db
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=ITHelpdeskDB;User Id=sa;Password=Root@12345;TrustServerCertificate=True"
      Jwt__Key: "day-la-khoa-bi-mat-cho-bai-tap-nhom-it-helpdesk-2026"
    ports:
      - "8080:8080"

  # web:  # Commented out - frontend is in a separate workspace (fontend/)
  #   build: ./frontend
  #   depends_on:
  #     - api
  #   ports:
  #     - "3000:80"

volumes:
  mssql_data:
